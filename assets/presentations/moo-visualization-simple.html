<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Objective Optimization Explorer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .chart-point {
            cursor: pointer;
            transition: r 0.2s;
        }
        .chart-point:hover {
            r: 8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50">
    <div id="app" class="w-full min-h-screen p-6"></div>

    <script>
        // Generate random solutions in decision space
        function generateSolutions(numPoints) {
            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const x1 = Math.random() * 10;
                const x2 = Math.random() * 10;
                
                // Objective functions (both to be minimized)
                const f1 = Math.pow(x1, 2) + Math.pow(x2, 2);
                const f2 = Math.pow(x1 - 10, 2) + Math.pow(x2, 2);
                
                points.push({ x1, x2, f1, f2, id: i });
            }
            return points;
        }

        // Determine Pareto optimal solutions
        function categorizeSolutions(solutions) {
            const pareto = [];
            const dominated = [];

            solutions.forEach((sol, i) => {
                let isDominated = false;
                
                for (let j = 0; j < solutions.length; j++) {
                    if (i === j) continue;
                    
                    const other = solutions[j];
                    if (other.f1 <= sol.f1 && other.f2 <= sol.f2 && 
                        (other.f1 < sol.f1 || other.f2 < sol.f2)) {
                        isDominated = true;
                        break;
                    }
                }
                
                if (isDominated) {
                    dominated.push({ ...sol, type: 'dominated' });
                } else {
                    pareto.push({ ...sol, type: 'pareto' });
                }
            });

            return { pareto, dominated };
        }

        // Get dominated by selected
        function getDominatedBySelected(selectedPoint, solutions) {
            if (!selectedPoint) return [];
            return solutions.filter(sol => {
                if (sol.id === selectedPoint.id) return false;
                return selectedPoint.f1 <= sol.f1 && selectedPoint.f2 <= sol.f2 &&
                       (selectedPoint.f1 < sol.f1 || selectedPoint.f2 < sol.f2);
            }).map(sol => sol.id);
        }

        // Get solutions that dominate selected
        function getDominatingSelected(selectedPoint, solutions) {
            if (!selectedPoint) return [];
            return solutions.filter(sol => {
                if (sol.id === selectedPoint.id) return false;
                return sol.f1 <= selectedPoint.f1 && sol.f2 <= selectedPoint.f2 &&
                       (sol.f1 < selectedPoint.f1 || sol.f2 < selectedPoint.f2);
            }).map(sol => sol.id);
        }

        // Scale functions
        function scaleX(value, min, max, width, margin) {
            return margin + (value - min) / (max - min) * (width - 2 * margin);
        }

        function scaleY(value, min, max, height, margin) {
            return height - margin - (value - min) / (max - min) * (height - 2 * margin);
        }

        // Get point color
        function getPointColor(point, selectedPoint, dominatedBySelected, dominatingSelected, highlightDomination) {
            if (selectedPoint && point.id === selectedPoint.id) {
                return '#8B5CF6';
            }
            
            if (highlightDomination && selectedPoint) {
                if (dominatedBySelected.includes(point.id)) {
                    return '#EF4444';
                }
                if (dominatingSelected.includes(point.id)) {
                    return '#10B981';
                }
            }
            
            if (point.type === 'pareto') {
                return '#3B82F6';
            }
            return '#9CA3AF';
        }

        // Create SVG chart
        function createChart(containerId, data, xKey, yKey, xLabel, yLabel, width, height) {
            const margin = 60;
            const container = document.getElementById(containerId);
            
            const xValues = data.map(d => d[xKey]);
            const yValues = data.map(d => d[yKey]);
            const xMin = 0;
            const xMax = Math.max(...xValues) * 1.1;
            const yMin = 0;
            const yMax = Math.max(...yValues) * 1.1;

            let svg = `<svg width="${width}" height="${height}" class="bg-white">`;
            
            // Grid lines
            for (let i = 0; i <= 5; i++) {
                const x = scaleX(xMin + i * (xMax - xMin) / 5, xMin, xMax, width, margin);
                const y = scaleY(yMin + i * (yMax - yMin) / 5, yMin, yMax, height, margin);
                svg += `<line x1="${x}" y1="${margin}" x2="${x}" y2="${height - margin}" stroke="#e5e7eb" stroke-width="1"/>`;
                svg += `<line x1="${margin}" y1="${y}" x2="${width - margin}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
            }
            
            // Axes
            svg += `<line x1="${margin}" y1="${height - margin}" x2="${width - margin}" y2="${height - margin}" stroke="#374151" stroke-width="2"/>`;
            svg += `<line x1="${margin}" y1="${margin}" x2="${margin}" y2="${height - margin}" stroke="#374151" stroke-width="2"/>`;
            
            // Axis labels
            svg += `<text x="${width/2}" y="${height - 10}" text-anchor="middle" class="text-sm fill-gray-700">${xLabel}</text>`;
            svg += `<text x="20" y="${height/2}" text-anchor="middle" transform="rotate(-90 20 ${height/2})" class="text-sm fill-gray-700">${yLabel}</text>`;
            
            // Tick labels
            for (let i = 0; i <= 5; i++) {
                const xVal = (xMin + i * (xMax - xMin) / 5).toFixed(1);
                const yVal = (yMin + i * (yMax - yMin) / 5).toFixed(1);
                const x = scaleX(xMin + i * (xMax - xMin) / 5, xMin, xMax, width, margin);
                const y = scaleY(yMin + i * (yMax - yMin) / 5, yMin, yMax, height, margin);
                svg += `<text x="${x}" y="${height - margin + 20}" text-anchor="middle" class="text-xs fill-gray-600">${xVal}</text>`;
                svg += `<text x="${margin - 10}" y="${y + 5}" text-anchor="end" class="text-xs fill-gray-600">${yVal}</text>`;
            }
            
            // Draw Pareto front line
            const paretoPoints = data.filter(d => d.type === 'pareto').sort((a, b) => a[xKey] - b[xKey]);
            if (paretoPoints.length > 1) {
                let pathD = '';
                paretoPoints.forEach((point, i) => {
                    const x = scaleX(point[xKey], xMin, xMax, width, margin);
                    const y = scaleY(point[yKey], yMin, yMax, height, margin);
                    pathD += `${i === 0 ? 'M' : 'L'} ${x} ${y} `;
                });
                svg += `<path d="${pathD}" fill="none" stroke="#3B82F6" stroke-width="2"/>`;
            }
            
            // Points
            data.forEach(point => {
                const x = scaleX(point[xKey], xMin, xMax, width, margin);
                const y = scaleY(point[yKey], yMin, yMax, height, margin);
                const color = getPointColor(point, state.selectedPoint, state.dominatedBySelected, state.dominatingSelected, state.highlightDomination);
                svg += `<circle cx="${x}" cy="${y}" r="5" fill="${color}" class="chart-point" data-id="${point.id}" opacity="0.8"/>`;
            });
            
            // Reference lines for selected point
            if (state.selectedPoint) {
                const selX = scaleX(state.selectedPoint[xKey], xMin, xMax, width, margin);
                const selY = scaleY(state.selectedPoint[yKey], yMin, yMax, height, margin);
                svg += `<line x1="${selX}" y1="${margin}" x2="${selX}" y2="${height - margin}" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>`;
                svg += `<line x1="${margin}" y1="${selY}" x2="${width - margin}" y2="${selY}" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>`;
            }
            
            svg += `</svg>`;
            container.innerHTML = svg;
            
            // Add click handlers
            container.querySelectorAll('.chart-point').forEach(circle => {
                circle.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    handlePointClick(id);
                });
            });
        }

        // Application state
        let state = {
            numPoints: 50,
            solutions: [],
            categorizedSolutions: { pareto: [], dominated: [] },
            selectedPoint: null,
            showPareto: true,
            showDominated: true,
            highlightDomination: false,
            dominatedBySelected: [],
            dominatingSelected: []
        };

        function handlePointClick(id) {
            const point = state.solutions.find(s => s.id === id);
            if (state.selectedPoint && state.selectedPoint.id === id) {
                state.selectedPoint = null;
                state.highlightDomination = false;
            } else {
                state.selectedPoint = point;
                state.highlightDomination = true;
            }
            state.dominatedBySelected = getDominatedBySelected(state.selectedPoint, state.solutions);
            state.dominatingSelected = getDominatingSelected(state.selectedPoint, state.solutions);
            render();
        }

        function updateNumPoints(value) {
            state.numPoints = parseInt(value);
            state.selectedPoint = null;
            state.highlightDomination = false;
            initSolutions();
            render();
        }

        function toggleShowPareto() {
            state.showPareto = !state.showPareto;
            render();
        }

        function toggleShowDominated() {
            state.showDominated = !state.showDominated;
            render();
        }

        function initSolutions() {
            state.solutions = generateSolutions(state.numPoints);
            state.categorizedSolutions = categorizeSolutions(state.solutions);
        }

        function getVisibleData() {
            let data = [];
            if (state.showPareto) data = data.concat(state.categorizedSolutions.pareto);
            if (state.showDominated) data = data.concat(state.categorizedSolutions.dominated);
            return data;
        }

        function render() {
            const visibleData = getVisibleData();
            
            const html = `
                <div class="max-w-7xl mx-auto">
                    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <h1 class="text-3xl font-bold text-gray-800 mb-2">
                            Multi-Objective Optimization Explorer
                        </h1>
                        <p class="text-gray-600 mb-4">
                            Explore the relationship between decision space (design variables) and objective space (performance metrics)
                        </p>

                        <!-- Controls -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-gray-50 rounded-lg">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Number of Solutions: ${state.numPoints}
                                </label>
                                <input
                                    type="range"
                                    min="10"
                                    max="200"
                                    value="${state.numPoints}"
                                    onchange="updateNumPoints(this.value)"
                                    class="w-full"
                                />
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="flex items-center gap-2">
                                    <input
                                        type="checkbox"
                                        ${state.showPareto ? 'checked' : ''}
                                        onchange="toggleShowPareto()"
                                        class="w-4 h-4"
                                    />
                                    <span class="text-sm font-medium text-gray-700">
                                        Show Pareto Optimal Solutions (${state.categorizedSolutions.pareto.length})
                                    </span>
                                </label>
                                <label class="flex items-center gap-2">
                                    <input
                                        type="checkbox"
                                        ${state.showDominated ? 'checked' : ''}
                                        onchange="toggleShowDominated()"
                                        class="w-4 h-4"
                                    />
                                    <span class="text-sm font-medium text-gray-700">
                                        Show Dominated Solutions (${state.categorizedSolutions.dominated.length})
                                    </span>
                                </label>
                            </div>
                        </div>

                        <!-- Legend and Info -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                <h3 class="font-semibold text-blue-900 mb-2">Color Legend</h3>
                                <div class="space-y-1 text-sm">
                                    <div class="flex items-center gap-2">
                                        <div class="w-4 h-4 rounded-full bg-blue-500"></div>
                                        <span>Pareto Optimal (non-dominated)</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <div class="w-4 h-4 rounded-full bg-gray-400"></div>
                                        <span>Dominated Solutions</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <div class="w-4 h-4 rounded-full bg-purple-500"></div>
                                        <span>Selected Solution</span>
                                    </div>
                                    ${state.highlightDomination ? `
                                        <div class="flex items-center gap-2">
                                            <div class="w-4 h-4 rounded-full bg-red-500"></div>
                                            <span>Dominated by selected</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <div class="w-4 h-4 rounded-full bg-green-500"></div>
                                            <span>Dominates selected</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>

                            ${state.selectedPoint ? `
                                <div class="bg-purple-50 p-4 rounded-lg border border-purple-200">
                                    <h3 class="font-semibold text-purple-900 mb-2">Selected Solution</h3>
                                    <div class="text-sm space-y-1">
                                        <div><strong>Decision Variables:</strong> x₁=${state.selectedPoint.x1.toFixed(2)}, x₂=${state.selectedPoint.x2.toFixed(2)}</div>
                                        <div><strong>Objectives:</strong> f₁=${state.selectedPoint.f1.toFixed(2)}, f₂=${state.selectedPoint.f2.toFixed(2)}</div>
                                        <div><strong>Status:</strong> ${state.selectedPoint.type === 'pareto' ? 'Pareto Optimal' : 'Dominated'}</div>
                                        ${state.highlightDomination ? `
                                            <div class="text-red-600"><strong>Dominates:</strong> ${state.dominatedBySelected.length} solutions</div>
                                            <div class="text-green-600"><strong>Dominated by:</strong> ${state.dominatingSelected.length} solutions</div>
                                        ` : ''}
                                    </div>
                                </div>
                            ` : '<div></div>'}
                        </div>
                    </div>

                    <!-- Charts -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Decision Space -->
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">Decision Space (Design Variables)</h2>
                            <p class="text-sm text-gray-600 mb-4">
                                Each point represents a design choice with variables x₁ and x₂
                            </p>
                            <div id="decision-chart"></div>
                        </div>

                        <!-- Objective Space -->
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">Objective Space (Performance Metrics)</h2>
                            <p class="text-sm text-gray-600 mb-4">
                                Each point shows the performance (both objectives to minimize). Blue points form the Pareto Front.
                            </p>
                            <div id="objective-chart"></div>
                        </div>
                    </div>

                    <!-- Optimization Problem Explanation -->
                    <div class="mt-6 bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Optimization Problem Definition</h2>
                        <div class="bg-gradient-to-r from-indigo-50 to-blue-50 p-6 rounded-lg border-2 border-indigo-200 mb-4">
                            <h3 class="font-semibold text-indigo-900 mb-3 text-lg">Mathematical Formulation</h3>
                            <div class="space-y-4">
                                <div>
                                    <p class="text-gray-700 mb-2"><strong>Decision Variables:</strong></p>
                                    <p class="ml-4 font-mono text-sm bg-white px-3 py-2 rounded border border-gray-200">
                                        x₁, x₂ ∈ [0, 10]
                                    </p>
                                    <p class="text-gray-600 text-sm mt-1 ml-4">
                                        These represent design choices or parameters you can control
                                    </p>
                                </div>
                                
                                <div>
                                    <p class="text-gray-700 mb-2"><strong>Objective Functions (both to minimize):</strong></p>
                                    <div class="ml-4 space-y-3">
                                        <div class="bg-white px-3 py-2 rounded border border-gray-200">
                                            <p class="font-mono text-sm mb-1">f₁(x₁, x₂) = x₁² + x₂²</p>
                                            <p class="text-gray-600 text-sm">
                                                → Minimizes distance from origin (0,0). Prefers smaller values of both variables.
                                            </p>
                                        </div>
                                        <div class="bg-white px-3 py-2 rounded border border-gray-200">
                                            <p class="font-mono text-sm mb-1">f₂(x₁, x₂) = (x₁ - 10)² + x₂²</p>
                                            <p class="text-gray-600 text-sm">
                                                → Minimizes distance from point (10,0). Prefers x₁ close to 10 and x₂ close to 0.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div class="bg-amber-50 border-l-4 border-amber-400 p-4 mt-4">
                                    <p class="text-amber-900 font-semibold mb-2">⚡ The Conflict:</p>
                                    <p class="text-gray-700 text-sm">
                                        These objectives conflict because f₁ wants both variables small (near origin), 
                                        while f₂ wants x₁ large (near 10). There is no single solution that minimizes both 
                                        simultaneously, creating a trade-off that results in the Pareto Front.
                                    </p>
                                </div>

                                <div class="bg-green-50 border-l-4 border-green-400 p-4">
                                    <p class="text-green-900 font-semibold mb-2">💡 Real-World Analogy:</p>
                                    <p class="text-gray-700 text-sm">
                                        Think of choosing a location for your home where f₁ represents distance to downtown 
                                        and f₂ represents distance to the airport. You can't minimize both - you'll need to 
                                        find a compromise based on your priorities.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Educational Information -->
                    <div class="mt-6 bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Key Concepts</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                            <div class="p-4 bg-blue-50 rounded-lg">
                                <h3 class="font-semibold text-blue-900 mb-2">Pareto Optimal Solutions</h3>
                                <p class="text-gray-700">
                                    Solutions where you cannot improve one objective without worsening another. These form the Pareto Front (blue line in objective space).
                                </p>
                            </div>
                            <div class="p-4 bg-gray-50 rounded-lg">
                                <h3 class="font-semibold text-gray-900 mb-2">Dominated Solutions</h3>
                                <p class="text-gray-700">
                                    Solutions where at least one other solution is better in all objectives. These should be discarded in favor of Pareto optimal alternatives.
                                </p>
                            </div>
                            <div class="p-4 bg-purple-50 rounded-lg">
                                <h3 class="font-semibold text-purple-900 mb-2">Interactive Exploration</h3>
                                <p class="text-gray-700">
                                    Click any point to see which solutions it dominates (red) and which solutions dominate it (green). This helps understand dominance relationships.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('app').innerHTML = html;
            
            // Render charts
            createChart('decision-chart', visibleData, 'x1', 'x2', 'Decision Variable x₁', 'Decision Variable x₂', 600, 400);
            createChart('objective-chart', visibleData, 'f1', 'f2', 'Objective f₁ (minimize)', 'Objective f₂ (minimize)', 600, 400);
        }

        // Initialize
        initSolutions();
        render();
    </script>
</body>
</html>
